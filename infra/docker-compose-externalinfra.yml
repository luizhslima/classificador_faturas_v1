

services:
  postgres-n8n:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-n8n}
      POSTGRES_USER: ${POSTGRES_USER:-n8n}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-n8n_dev_password}
    ports:
      - "5433:5432"
    volumes:
      - postgres_n8n_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-n8n}"]
      interval: 10s
      timeout: 5s
      retries: 5
  minio:
    image: minio/minio:latest
    container_name: minio_datalake
    ports:
      - "9000:9000" # API S3
      - "9001:9001" # Interface Gráfica Web
    environment:
      - MINIO_ROOT_USER=admin_tcc
      - MINIO_ROOT_PASSWORD=senha_super_segura
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - tcc_network

  minio-setup:
    image: minio/mc:latest
    container_name: minio_setup
    depends_on:
      - minio
    entrypoint: /bin/sh scripts/setup_minio.sh
    volumes:
      - ./scripts/setup_minio.sh:/setup_minio.sh
    networks:
      - tcc_network
  
  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    ports:
      - "5000:5000"
    environment:
      - MLFLOW_BACKEND_STORE_URI=postgresql://n8n:n8n_dev_password@postgres-n8n:5432/mlops_db
      - MLFLOW_DEFAULT_ARTIFACT_ROOT=s3://mlflow-artifacts/
      - AWS_ACCESS_KEY_ID=admin
      - AWS_SECRET_ACCESS_KEY=password
      - MLFLOW_S3_ENDPOINT_URL=http://minio:9000
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri postgresql://n8n:n8n_dev_password@postgres-n8n:5432/mlops_db
      --default-artifact-root s3://mlflow-artifacts/
    depends_on:
      - postgres-n8n
      - minio

  kafka:
    image: apache/kafka:4.3.0
    container_name: kafka
    user: "root"
    ports:
    - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://192.168.15.16:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
    volumes:
    - kafka_data:/opt/kafka/logs
    networks:
      - tcc_network

  # Service to create topics
  init:
    build: .
    depends_on:
      - kafka
    command: ["python", "/scripts/init.py"]
    restart: on-failure
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPICS: test-topic,events-topic,datalake-bronze-ingestao-topic

volumes:
  postgres_n8n_data:
  minio_data:
  kafka_data:

networks:
  tcc_network:
    driver: bridge
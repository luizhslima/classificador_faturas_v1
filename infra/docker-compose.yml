version: '3.8'

services:
  # ==========================================
  # 1. CAMADA DE ARMAZENAMENTO (DATA LAKEHOUSE)
  # ==========================================
  minio:
    image: minio/minio:latest
    container_name: minio_datalake
    ports:
      - "9000:9000" # API S3
      - "9001:9001" # Interface Gráfica Web
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:?defina MINIO_ROOT_USER em infra/.env}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:?defina MINIO_ROOT_PASSWORD em infra/.env}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - tcc_network

  # Script temporário para criar os buckets automaticamente ao iniciar
  minio-setup:
    image: minio/mc:latest
    container_name: minio_setup
    depends_on:
      - minio
    entrypoint: /bin/sh scripts/setup_minio.sh
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:?defina MINIO_ROOT_USER em infra/.env}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:?defina MINIO_ROOT_PASSWORD em infra/.env}
    volumes:
      - ./scripts/setup_minio.sh:/setup_minio.sh
    networks:
      - tcc_network
  # ==========================================
  # 2. CAMADA DE MENSAGERIA (EVENT STREAMING)
  # ==========================================
  kafka:
    image: dhi.io/kafka:4.3.0
    container_name: kafka
    ports:
    - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_PROCESS_ROLES: broker,controller
    volumes:
    - kafka_data:/opt/kafka/logs
    networks:
      - tcc_network

  # Service to create topics
  init:
    build: .
    depends_on:
      - kafka
    command: ["python", "/scripts/init.py"]
    restart: on-failure
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPICS: test-topic,events-topic,datalake-bronze-ingestao-topic

  # ==========================================
  # 3. CAMADA ANALÍTICA E BI (CONSUMO)
  # ==========================================
  trino:
    image: trinodb/trino:latest
    container_name: trino_sql_engine
    ports:
      - "8082:8080" # Porta 8082 para não conflitar com o Spring WebFlux
    depends_on:
      - minio
    networks:
      - tcc_network

  metabase:
    image: metabase/metabase:latest
    container_name: metabase_bi
    ports:
      - "3000:3000"
    environment:
      - MB_DB_FILE=/metabase-data/metabase.db
    volumes:
      - metabase_data:/metabase-data
    depends_on:
      - trino
    networks:
      - tcc_network

  # ==========================================
  # 4. OS SEUS MICROSSERVIÇOS (CÓDIGO CUSTOMIZADO)
  # ==========================================
  # api-ingestao:
  #   build: ../api-ingestao
  #   container_name: spring_api
  #   ports:
  #     - "8080:8080"
  #   environment:
  #     - KAFKA_BROKERS=kafka:9092
  #     - MINIO_URL=http://minio:9000
  #   depends_on:
  #     - kafka
  #     - minio
  #   networks:
  #     - tcc_network

  # worker-ocr:
  #   build: ../worker-ocr
  #   container_name: python_ocr
  #   environment:
  #     - KAFKA_BROKERS=kafka:9092
  #     - MINIO_URL=http://minio:9000
  #   depends_on:
  #     - kafka
  #     - minio
  #   networks:
  #     - tcc_network

  # worker-ia:
  #   build: ../worker-ia
  #   container_name: python_ia
  #   environment:
  #     - KAFKA_BROKERS=kafka:9092
  #     - MINIO_URL=http://minio:9000
  #   depends_on:
  #     - kafka
  #     - minio
  #   networks:
  #     - tcc_network

# ==========================================
# VOLUMES E REDES
# ==========================================
volumes:
  minio_data:
  kafka_data:
  metabase_data:

networks:
  tcc_network:
    driver: bridge